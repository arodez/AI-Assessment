# Pre-commit hooks for tier-2-legacy-rescue/solution.
#
# Every hook shells out to the Poetry-managed environment declared in
# tier-2-legacy-rescue/solution/pyproject.toml, so tool versions live in one
# place (poetry.lock) instead of being pinned a second time here. `files:`
# scopes each hook to that subproject, so commits touching any other tier
# in this repo are unaffected and don't pay the cost of running them.
#
# One-time setup:
#   cd tier-2-legacy-rescue/solution && poetry install
#   poetry run pre-commit install   # writes the hook into ../../.git/hooks
#
# The pytest hook enforces the 100% coverage gate configured in
# tier-2-legacy-rescue/solution/pyproject.toml (--cov-fail-under=100), so it
# will legitimately block a commit until report_generator_fixed.py exists
# and every line the test suite exercises is covered. Bypass a deliberate
# WIP commit with `git commit --no-verify`.
repos:
  - repo: local
    hooks:
      - id: ruff-check-tests
        name: "solution: ruff check (tests)"
        entry: bash -c 'cd tier-2-legacy-rescue/solution && poetry run ruff check tests'
        language: system
        files: ^tier-2-legacy-rescue/solution/tests/.*\.py$
        pass_filenames: false

      - id: ruff-format-tests
        name: "solution: ruff format --check (tests)"
        entry: bash -c 'cd tier-2-legacy-rescue/solution && poetry run ruff format --check tests'
        language: system
        files: ^tier-2-legacy-rescue/solution/tests/.*\.py$
        pass_filenames: false

      - id: mypy-tests
        name: "solution: mypy (tests)"
        entry: bash -c 'cd tier-2-legacy-rescue/solution && poetry run mypy tests'
        language: system
        files: ^tier-2-legacy-rescue/solution/(tests/.*\.py|report_generator_fixed\.pyi)$
        pass_filenames: false

      - id: pytest-coverage
        name: "solution: pytest (100% coverage gate)"
        entry: bash -c 'cd tier-2-legacy-rescue/solution && poetry run pytest'
        language: system
        files: ^tier-2-legacy-rescue/solution/(tests/.*\.py|report_generator_fixed\.(py|pyi))$
        pass_filenames: false
